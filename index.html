<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TitipKuy - Titip apa aja, Kuy!</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFAF2;--card:#fff;--ink:#27442F;--mute:#66796C;--g:#2A8550;--g2:#3FA468;--gl:#E4F3E8;--y:#F7B928;--yl:#FFF3CF;--line:#E3EBDD;--sh:0 8px 20px -14px rgba(39,68,47,.35);color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#EAF3E6;color:var(--ink);font:400 15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
.app{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 40px -20px rgba(0,0,0,.3);position:relative;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{margin:0;font:800 19px "Plus Jakarta Sans";flex:1}header h1 small{display:block;font:500 11px "Plus Jakarta Sans";color:var(--mute)}
header h1 b{color:var(--y)}
.back{border:0;background:var(--gl);color:var(--g);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;padding:8px 2px 9px;font:600 11px "Plus Jakarta Sans";color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center}
nav button i{font-style:normal;font-size:19px}nav button.on{color:var(--g)}
h2{font:800 22px/1.25 "Plus Jakarta Sans";margin:0 0 4px}h3{font:800 16px "Plus Jakarta Sans";margin:22px 0 8px}
.mute{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:10px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:11px}.sp{flex:1}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:14px;font:700 15px "Plus Jakarta Sans";background:var(--g);color:#fff;cursor:pointer}
.btn.y{background:var(--y);color:#3a2c00}.btn.l{background:var(--gl);color:var(--g)}.btn:disabled{opacity:.45}
.mini{border:0;border-radius:10px;padding:8px 14px;background:var(--g);color:#fff;font:700 13px "Plus Jakarta Sans";cursor:pointer}
.ic{width:42px;height:42px;border-radius:12px;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.hero{background:linear-gradient(150deg,#DDF1E2,#FFF6D8);border-radius:20px;padding:18px}
.search{width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.role{border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px;text-align:left;font:inherit;cursor:pointer;color:var(--ink)}
.role b{display:block;font-size:14px}.role span{font-size:12px;color:var(--mute)}.role.t{border-color:var(--g2)}.role.a{border-color:var(--y)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 4px;font:600 12px "Plus Jakarta Sans";color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.cat i{font-style:normal;font-size:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font:600 13px "Plus Jakarta Sans";color:var(--ink);cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
label{display:block;font-weight:700;font-size:13px;margin:16px 0 6px}
input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}
.stp{display:flex;align-items:center;justify-content:center;gap:18px}.stp button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;color:var(--g);cursor:pointer}
.stp b{font:800 22px "Plus Jakarta Sans";min-width:110px;text-align:center}
.fee{font-weight:800;color:var(--g)}.star{color:#E9A400;font-weight:700}
.how{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
.num{width:28px;height:28px;border-radius:50%;background:var(--g);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.why{display:grid;grid-template-columns:1fr 1fr;gap:10px}.why .card{margin:0;text-align:center}.why i{font-style:normal;font-size:28px}.why b{display:block;font-size:13px}
.band{background:var(--g);color:#fff;border-radius:18px;padding:16px;margin-top:20px}.band b{color:var(--y)}
.chat{display:flex;flex-direction:column;gap:8px;margin:14px 0}.bb{max-width:80%;padding:10px 13px;border-radius:16px;background:var(--gl)}.bb.me{align-self:flex-end;background:var(--g);color:#fff}
.tl{list-style:none;padding:0;margin:16px 0 0}.tl li{position:relative;padding:0 0 22px 36px;color:var(--mute)}
.tl li:before{content:"";position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:#fff}
.tl li:after{content:"";position:absolute;left:10px;top:24px;bottom:0;width:2px;background:var(--line)}.tl li:last-child:after{display:none}
.tl li.d{color:var(--ink);font-weight:700}.tl li.d:before{background:var(--g);border-color:var(--g)}
.stars button{border:0;background:none;font-size:34px;cursor:pointer;color:#D9DED5}.stars button.on{color:#F2B100}
.badge{background:var(--y);color:#3a2c00;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;margin-left:6px}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--ink);color:#fff;padding:11px 14px;border-radius:12px;font-size:13px;text-align:center}
button:focus-visible,input:focus-visible{outline:3px solid var(--y);outline-offset:2px}
</style>
</head>
<body>
<div class="app"><header id="hd"></header><main id="mn"></main><nav id="nv"></nav></div>
<script>
const rp=n=>'Rp '+n.toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[['🍱','Makanan'],['🥤','Minuman'],['🖨️','Fotokopi'],['📄','Dokumen'],['🛒','Belanja'],['⋯','Lainnya']];
const FROM=['Kantin FEB','Minimarket','Fotokopi','Lainnya'],TO=['Gedung A','Gedung B','Gedung C','Perpustakaan'];
const COUR=[{n:'Dina',r:4.9,m:12,j:38},{n:'Raka',r:4.8,m:8,j:25},{n:'Salsa',r:4.7,m:15,j:51}];
const OPEN=[{ic:'🍛',item:'Nasi ayam geprek',from:'Kantin FEB',to:'Gedung B',fee:5000,who:'Aulia'},{ic:'🖨️',item:'Print tugas 40 halaman',from:'Fotokopi',to:'Perpustakaan',fee:5000,who:'Rafi'},{ic:'🥤',item:'Air mineral 2 botol',from:'Minimarket',to:'Gedung A',fee:3000,who:'Dinda'},{ic:'📄',item:'Ambil surat di Akademik',from:'Lainnya',to:'Gedung C',fee:6000,who:'Bayu'}];
const S={tab:'home',scr:'home',role:'titip',order:null,cour:null,offer:0,msgs:[],agreed:false,step:0,rate:0,on:true,earn:0,toast:'',
hist:[{ic:'🖨️',item:'Fotokopi 20 lembar',fee:3000,who:'Rani',date:'Kemarin',role:'titip'},{ic:'🥤',item:'Teh botol dan roti',fee:2000,who:'Dimas',date:'Senin',role:'titip'}],
draft:{cat:'Makanan',item:'',from:'Kantin FEB',to:'Gedung A',fee:5000}};
const LOGO=`<svg width="34" height="34" viewBox="0 0 40 40" aria-label="Logo TitipKuy"><rect width="40" height="40" rx="11" fill="#2A8550"/><path d="M20 8l9 4.5v10L20 27l-9-4.5v-10z" fill="#F7B928"/><path d="M11 12.5L20 17l9-4.5M20 17v10" stroke="#2A8550" stroke-width="2" fill="none"/><circle cx="20" cy="6" r="3" fill="#fff"/></svg>`;
const go=(s,t)=>{S.scr=s;if(t)S.tab=t;render();document.getElementById('mn').scrollTop=0};
const tip=t=>{S.toast=t;render();setTimeout(()=>{S.toast='';render()},1800)};
function begin(order,role,cour){S.order=order;S.role=role;S.cour=cour;S.offer=order.fee;S.agreed=false;S.step=0;S.rate=0;
S.msgs=role==='titip'?[{me:1,t:`Halo ${cour.n}! Tolong titip ${order.item} dari ${order.from} ke ${order.to}. Ongkirnya ${rp(order.fee)} ya?`}]:[{me:0,t:`Halo! Aku titip ${order.item} dari ${order.from} ke ${order.to}. Ongkir ${rp(order.fee)}.`}];go('nego')}
function offer(d){S.offer=Math.max(1000,S.offer+d);S.msgs.push({me:1,t:`Bagaimana kalau ongkirnya ${rp(S.offer)}?`});render();
setTimeout(()=>{const ok=S.role==='antar'||S.offer>=S.order.fee-1000;S.msgs.push({me:0,t:ok?`Oke, sepakat di ${rp(S.offer)}!`:'Agak kurang nih, bisa naik sedikit lagi?'});S.agreed=ok;render()},650)}
function render(){
const sc=S.scr,hd=document.getElementById('hd'),mn=document.getElementById('mn'),nv=document.getElementById('nv');
const T={home:'',find:'Pilih pengantar',new:'Buat pesanan',nego:'Negosiasi ongkir',status:'Status pesanan',done:'Selesai',antar:'Mode Pengantar',hist:'Riwayat',profil:'Profil',tentang:'Tentang TitipKuy'};
const main=['home','antar','hist','profil'].includes(sc);
hd.innerHTML=(sc==='home'?LOGO+`<h1>Titip<b>Kuy</b><small>Titip apa aja, Kuy!</small></h1>`:(main?'':'<button class="back" id="bk" aria-label="Kembali">‹</button>')+`<h1>${T[sc]}</h1>`);
const bk=document.getElementById('bk');if(bk)bk.onclick=()=>go({new:'home',find:'new',nego:S.role==='titip'?'find':'antar',tentang:'profil'}[sc]||'home',{nego:S.role==='titip'?'home':'antar'}[sc]);
nv.innerHTML=[['home','🏠','Beranda'],['antar','🛵','Antar'],['hist','🧾','Riwayat'],['profil','👤','Profil']].map(x=>`<button data-n="${x[0]}" class="${S.tab===x[0]?'on':''}"><i>${x[1]}</i>${x[2]}</button>`).join('');
nv.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.n,b.dataset.n));
let h='';
if(sc==='home'){
h=`<div class="hero"><h2>Hai, Mahasiswa! 👋</h2><div class="mute">Mau titip apa hari ini?</div><input class="search" id="q" placeholder="🔍 Cari layanan titip... lalu tekan Enter">
<div class="two"><button class="role t" id="rt"><b>Sibuk? Titip aja!</b><span>Titipkan ke teman satu kampus</span></button><button class="role a" id="ra"><b>Punya waktu luang?</b><span>Antar aja &amp; dapatkan penghasilan!</span></button></div></div>
<h3>Layanan titip</h3><div class="cats">${CATS.map(c=>`<button class="cat" data-c="${c[1]}"><i>${c[0]}</i>${c[1]}</button>`).join('')}</div>
<h3>Pengantar terdekat <span class="mute">Siap membantu kamu!</span></h3>${COUR.map((c,i)=>`<div class="card row"><div class="ic">🧑‍🎓</div><div class="sp"><b>${c.n}</b> <span class="star">★ ${c.r}</span><div class="mute">${c.m} mnt dari lokasi kamu · ${c.j} titipan selesai</div></div><button class="mini" data-p="${i}">Pilih</button></div>`).join('')}
<h3>Cara kerja TitipKuy</h3>${[['📱','Buat pesanan','Pilih jenis titipan dan isi detail pesananmu.'],['🔎','Cari pengantar','Pengantar terdekat akan menerima pesananmu.'],['🤝','Negosiasi ongkir','Tentukan ongkir sesuai kesepakatan kalian.'],['🛵','Pesanan dikirim','Pengantar mengambil dan mengantarkan pesananmu.'],['✅','Selesai','Pesanan diterima, keduanya saling diuntungkan!']].map((s,i)=>`<div class="how"><div class="num">${i+1}</div><div><b>${s[0]} ${s[1]}</b><div class="mute">${s[2]}</div></div></div>`).join('')}
<h3>Kenapa TitipKuy lebih unggul?</h3><div class="why">${[['👥','Antar mahasiswa saja','Lebih aman, terpercaya, dan saling kenal.'],['🤝','Ongkir bisa dinegosiasikan','Fleksibel sesuai kesepakatan kedua belah pihak.'],['⚡','Mudah &amp; praktis','Cukup beberapa klik di web atau aplikasi.'],['👛','Hemat &amp; menguntungkan','Hemat waktu, tenaga, sekaligus dapat penghasilan.']].map(w=>`<div class="card"><i>${w[0]}</i><b>${w[1]}</b><div class="mute">${w[2]}</div></div>`).join('')}</div>
<div class="band"><b>Hemat waktu, dapat penghasilan, semua di TitipKuy!</b><div style="font-size:13px;margin-top:6px">✔ Fleksibel sesuai waktu masing-masing<br>✔ Tidak ribet, semua serba mudah<br>✔ Saling membantu sesama mahasiswa<br>✔ Menciptakan peluang, memberi manfaat</div></div>
<button class="btn l" id="ab">Lihat target awal &amp; tahap saat ini</button>`}
if(sc==='new'){const d=S.draft;
h=`<label style="margin-top:0">Jenis titipan</label><div class="chips">${CATS.map(c=>`<button class="chip ${d.cat===c[1]?'on':''}" data-c="${c[1]}">${c[0]} ${c[1]}</button>`).join('')}</div>
<label for="it">Detail pesanan</label><input type="text" id="it" placeholder="Contoh: nasi ayam geprek + es teh" value="${esc(d.item)}">
<label>Beli / ambil di mana?</label><div class="chips">${FROM.map(f=>`<button class="chip ${d.from===f?'on':''}" data-f="${f}">${f}</button>`).join('')}</div>
<label>Antar ke mana?</label><div class="chips">${TO.map(f=>`<button class="chip ${d.to===f?'on':''}" data-t="${f}">${f}</button>`).join('')}</div>
<label>Tawaran ongkir <span class="mute">(bisa dinegosiasikan)</span></label><div class="stp"><button id="mi" aria-label="Kurangi">−</button><b>${rp(d.fee)}</b><button id="pl" aria-label="Tambah">+</button></div>
<button class="btn" id="go" ${d.item.trim()?'':'disabled'}>Cari pengantar</button>`}
if(sc==='find'){h=`<div class="card"><b>${esc(S.draft.item)}</b><div class="mute">${esc(S.draft.from)} → ${esc(S.draft.to)} · Ongkir ${rp(S.draft.fee)}</div></div><h3>Pengantar tersedia</h3>`+COUR.map((c,i)=>`<div class="card row"><div class="ic">🧑‍🎓</div><div class="sp"><b>${c.n}</b> <span class="star">★ ${c.r}</span><div class="mute">${c.m} mnt dari lokasi kamu</div></div><button class="mini" data-p="${i}">Pilih</button></div>`).join('')}
if(sc==='nego'){const o=S.order;
h=`<div class="card"><b>${esc(o.item)}</b><div class="mute">${esc(o.from)} → ${esc(o.to)} · ${S.role==='titip'?'Pengantar: '+esc(S.cour.n):'Pemesan: '+esc(S.cour.n)}</div></div>
<div class="chat">${S.msgs.map(m=>`<div class="bb ${m.me?'me':''}">${esc(m.t)}</div>`).join('')}</div>
<div class="chips"><button class="chip" id="up">+ Rp1.000</button><button class="chip" id="dn">− Rp1.000</button><span class="mute" style="align-self:center">Penawaran: <b>${rp(S.offer)}</b></span></div>
<button class="btn y" id="ok" ${S.agreed?'':'disabled'}>Setuju di ${rp(S.offer)}</button>`}
if(sc==='status'){const st=['Pesanan diterima pengantar','Sedang dibelikan / diambil','Dalam perjalanan','Pesanan sampai di tujuan'],last=S.step===3;
h=`<div class="card"><b>${esc(S.order.item)}</b><div class="mute">${esc(S.order.from)} → ${esc(S.order.to)}</div><div class="fee">Ongkir disepakati ${rp(S.offer)}</div></div>
<ul class="tl">${st.map((s,i)=>`<li class="${i<=S.step?'d':''}">${s}</li>`).join('')}</ul>
<button class="btn" id="nx">${last?'Pesanan diterima / selesai':'Lanjut ke tahap berikutnya'}</button><p class="mute" style="text-align:center">Tombol ini untuk simulasi prototipe.</p>`}
if(sc==='done'){h=`<div style="text-align:center;padding-top:10px"><div style="font-size:60px">🎉</div><h2>Pesanan selesai!</h2><div class="mute">Keduanya saling diuntungkan. ${S.role==='antar'?'Kamu dapat '+rp(S.offer)+'.':'Beri nilai untuk '+esc(S.cour.n)+'.'}</div>
<div class="stars" style="margin-top:12px">${[1,2,3,4,5].map(i=>`<button data-s="${i}" class="${i<=S.rate?'on':''}" aria-label="${i} bintang">★</button>`).join('')}</div></div><button class="btn" id="fin">Simpan &amp; lihat riwayat</button>`}
if(sc==='antar'){h=`<div class="hero"><h2>Mau jadi pengantar? 🛵</h2><div class="mute">Antar aja &amp; dapatkan penghasilan tambahan.</div><div class="two"><div class="card" style="margin:0"><div class="mute">Penghasilan</div><div class="fee" style="font-size:19px">${rp(S.earn)}</div></div><div class="card" style="margin:0"><div class="mute">Status</div><b>${S.on?'🟢 Aktif':'⚪ Istirahat'}</b></div></div>
<button class="btn ${S.on?'l':''}" id="tg" style="margin-top:12px">${S.on?'Istirahat dulu':'Aktifkan penerimaan titipan'}</button></div>
<h3>Titipan di sekitar kampus <span class="badge">${S.on?OPEN.length:0} aktif</span></h3>`+(S.on?OPEN.map((o,i)=>`<div class="card row"><div class="ic">${o.ic}</div><div class="sp"><b>${esc(o.item)}</b><div class="mute">${esc(o.from)} → ${esc(o.to)} · ${esc(o.who)}</div><div class="fee">${rp(o.fee)}</div></div><button class="mini" data-o="${i}">Ambil</button></div>`).join(''):'<p class="mute">Aktifkan dulu untuk melihat titipan.</p>')}
if(sc==='hist'){h=`<h2>Riwayat pesanan</h2>`+(S.hist.map(x=>`<div class="card row"><div class="ic">${x.ic}</div><div class="sp"><b>${esc(x.item)}</b><div class="mute">${x.role==='antar'?'Kamu antar untuk':'Diantar oleh'} ${esc(x.who)} · ${esc(x.date)}</div></div><div class="fee">${x.role==='antar'?'+':''}${rp(x.fee)}</div></div>`).join(''))}
if(sc==='profil'){const M=[['📍','Alamat & lokasi kampus'],['💳','Metode pembayaran'],['⭐','Ulasan untukku'],['❓','Pusat bantuan']];
h=`<div class="row"><div class="ic" style="width:60px;height:60px;border-radius:50%;font-size:28px">🧑‍🎓</div><div><b style="font-size:17px">Mahasiswa TitipKuy</b><div class="mute">Satu kampus · Satu fakultas</div></div></div>
<div class="two" style="grid-template-columns:repeat(3,1fr)"><div class="card" style="margin:0;text-align:center"><div class="fee">${S.hist.length}</div><div class="mute">Pesanan</div></div><div class="card" style="margin:0;text-align:center"><div class="fee">4.9</div><div class="mute">Rating</div></div><div class="card" style="margin:0;text-align:center"><div class="fee" style="font-size:14px">${rp(S.earn)}</div><div class="mute">Penghasilan</div></div></div>
${M.map(m=>`<div class="card row" data-m="1" style="cursor:pointer"><div class="ic">${m[0]}</div><div class="sp">${m[1]}</div>›</div>`).join('')}<div class="card row" id="tt" style="cursor:pointer"><div class="ic">ℹ️</div><div class="sp">Tentang TitipKuy</div>›</div>`}
if(sc==='tentang'){h=`<div class="hero"><h2>Platform titip-menitip antar mahasiswa</h2><b>Oleh mahasiswa, untuk mahasiswa!</b><p class="mute">TitipKuy memudahkan mahasiswa menitipkan makanan, barang, atau keperluan lain kepada mahasiswa lain di sekitar kampus.</p></div>
<div class="card"><b>🎯 Target awal</b><p class="mute" style="margin:4px 0 0">Teman sekelas dan satu fakultas untuk validasi permintaan dengan biaya rendah.</p></div>
<div class="card" style="background:var(--yl)"><b>💡 Tahap saat ini: Ideation</b><p class="mute" style="margin:4px 0 0">Validasi awal lewat wawancara mahasiswa dan uji coba via WhatsApp sebelum membuat aplikasi.</p></div>
<div class="card"><b>👥 Untuk siapa?</b><p class="mute" style="margin:4px 0 0">Mahasiswa yang sibuk dan butuh bantuan titip sesuatu, serta mahasiswa yang punya waktu luang dan ingin penghasilan tambahan.</p></div>
<p class="mute" style="text-align:center;margin-top:16px">“Lebih dari sekadar titip-menitip, TitipKuy adalah solusi pintar untuk mahasiswa aktif dan produktif.”</p>`}
mn.innerHTML=h+(S.toast?`<div class="toast">${S.toast}</div>`:'');
const $=id=>document.getElementById(id),on=(sel,f)=>mn.querySelectorAll(sel).forEach(f);
if(sc==='home'){$('q').onkeydown=e=>{if(e.key==='Enter'){S.draft.item=e.target.value;go('new')}};$('rt').onclick=()=>go('new');$('ra').onclick=()=>go('antar','antar');$('ab').onclick=()=>go('tentang');
on('[data-c]',b=>b.onclick=()=>{S.draft.cat=b.dataset.c;go('new')});on('[data-p]',b=>b.onclick=()=>{S.cour=COUR[b.dataset.p];go('new')})}
if(sc==='new'){const d=S.draft,it=$('it'),g=$('go');it.oninput=()=>{d.item=it.value;g.disabled=!it.value.trim()};
on('[data-c]',b=>b.onclick=()=>{d.cat=b.dataset.c;render()});on('[data-f]',b=>b.onclick=()=>{d.from=b.dataset.f;render()});on('[data-t]',b=>b.onclick=()=>{d.to=b.dataset.t;render()});
$('mi').onclick=()=>{d.fee=Math.max(1000,d.fee-500);render()};$('pl').onclick=()=>{d.fee+=500;render()};
g.onclick=()=>S.cour?begin({...d,ic:CATS.find(c=>c[1]===d.cat)[0]},'titip',S.cour):go('find')}
if(sc==='find')on('[data-p]',b=>b.onclick=()=>begin({...S.draft,ic:CATS.find(c=>c[1]===S.draft.cat)[0]},'titip',COUR[b.dataset.p]));
if(sc==='nego'){$('up').onclick=()=>offer(1000);$('dn').onclick=()=>offer(-1000);$('ok').onclick=()=>{S.order.fee=S.offer;go('status')}}
if(sc==='status')$('nx').onclick=()=>{if(S.step===3)go('done');else{S.step++;render()}};
if(sc==='done'){on('[data-s]',b=>b.onclick=()=>{S.rate=+b.dataset.s;render()});$('fin').onclick=()=>{if(S.role==='antar')S.earn+=S.offer;S.hist.unshift({ic:S.order.ic||'📦',item:S.order.item,fee:S.offer,who:S.cour.n,date:'Hari ini',role:S.role});S.cour=null;go('hist','hist')}}
if(sc==='antar'){const t=$('tg');t.onclick=()=>{S.on=!S.on;render()};on('[data-o]',b=>b.onclick=()=>{const o=OPEN[b.dataset.o];begin({...o},'antar',{n:o.who})})}
if(sc==='profil'){on('[data-m]',b=>b.onclick=()=>tip('Fitur ini hadir di tahap pengembangan berikutnya'));$('tt').onclick=()=>go('tentang')}}
render();
</script>
</body>
</html>
